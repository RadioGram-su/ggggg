name: Grom APK

on:
  push:
    branches: [player]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          mkdir -p out
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee out/build.log

      - name: Collect APK
        if: steps.build.outcome == 'success'
        run: cp app/build/outputs/apk/release/app-release.apk out/Grom.apk

      - name: Enable KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash ci/smoke.sh

      - name: Publish outputs
        if: always()
        run: |
          mkdir -p out
          cd out
          echo "${{ github.sha }} ${{ steps.build.outcome }}" > STATUS.txt
          git init -q
          git checkout -q -b player-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.run_number }} for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" player-out
